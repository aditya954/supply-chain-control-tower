name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff
        run: ruff check src tests scripts
      - name: Compile check
        run: python -m compileall src scripts

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest tests/unit/ -v --tb=short

  dbt_parse:
    name: dbt parse
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: dbt deps & parse
        env:
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ci-parse-only
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/ci_dummy_key.p8
        run: |
          touch /tmp/ci_dummy_key.p8
          dbt deps
          dbt parse

  dbt_test:
    name: dbt build (Snowflake)
    runs-on: ubuntu-latest
    needs: [unit_test, dbt_parse]
    if: vars.ENABLE_SNOWFLAKE_CI == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Configure Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          if echo "$SNOWFLAKE_PRIVATE_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > /tmp/snowflake_key.p8
          else
            echo "$SNOWFLAKE_PRIVATE_KEY" | tr -d ' \n\r\t' | base64 -d > /tmp/snowflake_key.p8
          fi
          chmod 600 /tmp/snowflake_key.p8
          openssl pkey -in /tmp/snowflake_key.p8 -passin pass:"$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" -noout
      - name: dbt build
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
        run: |
          dbt deps
          dbt build --select tag:inventory_risk

  ai_test:
    name: AI tests (mocked)
    runs-on: ubuntu-latest
    needs: unit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: RAG tests
        run: python -m pytest tests/ai/test_rag.py -v --tb=short

  integration_test:
    name: Integration tests (Snowflake)
    runs-on: ubuntu-latest
    needs: dbt_test
    if: vars.ENABLE_SNOWFLAKE_CI == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Configure Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          if echo "$SNOWFLAKE_PRIVATE_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > /tmp/snowflake_key.p8
          else
            echo "$SNOWFLAKE_PRIVATE_KEY" | tr -d ' \n\r\t' | base64 -d > /tmp/snowflake_key.p8
          fi
          chmod 600 /tmp/snowflake_key.p8
          openssl pkey -in /tmp/snowflake_key.p8 -passin pass:"$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" -noout
      - name: Retriever integration tests
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
        run: python -m pytest tests/ai/test_retriever.py -v --tb=short

  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [ai_test, dbt_parse]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t inventory-risk-assistant:${{ github.sha }} .
