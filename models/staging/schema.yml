unit_tests:
- name: test_stg_supplier_deduplicates_by_updated_at
  description: When duplicate supplier_id rows exist, retain only the most recently
    updated record.
  model: stg_supplier
  given:
  - input: ref('raw_supplier')
    rows:
    - supplier_id: 1
      supplier_code: SUP-000001
      supplier_name: Acme Corp
      supplier_tier: Tier 1
      country_code: US
      city: Chicago
      contact_email: OLD@ACME.COM
      contact_phone: 555-0001
      payment_terms: NET30
      lead_time_days: 10
      is_active: Y
      created_at: '2024-01-01'
      updated_at: '2024-06-01'
    - supplier_id: 1
      supplier_code: SUP-000001
      supplier_name: Acme Corp
      supplier_tier: Tier 1
      country_code: US
      city: Chicago
      contact_email: NEW@ACME.COM
      contact_phone: 555-0002
      payment_terms: NET45
      lead_time_days: 12
      is_active: Y
      created_at: '2024-01-01'
      updated_at: '2025-01-01'
    - supplier_id: 2
      supplier_code: SUP-000002
      supplier_name: Beta LLC
      supplier_tier: Tier 2
      country_code: DE
      city: Berlin
      contact_email: info@beta.de
      contact_phone: 555-0003
      payment_terms: NET60
      lead_time_days: 15
      is_active: Y
      created_at: '2024-02-01'
      updated_at: '2024-08-01'
  expect:
    rows:
    - supplier_id: 1
      supplier_code: SUP-000001
      supplier_name: Acme Corp
      contact_email: new@acme.com
      payment_terms: NET45
      lead_time_days: 12
      updated_at: '2025-01-01'
    - supplier_id: 2
      supplier_code: SUP-000002
      supplier_name: Beta LLC
      contact_email: info@beta.de
      payment_terms: NET60
      lead_time_days: 15
      updated_at: '2024-08-01'
- name: test_stg_purchase_orders_normalizes_po_status
  description: Purchase order status values are lowercased and trimmed during staging.
  model: stg_purchase_orders
  given:
  - input: ref('raw_purchase_orders')
    rows:
    - purchase_order_id: 100
      po_number: PO-00000100
      supplier_id: 1
      plant_id: 1
      buyer_employee_id: 1
      order_date: '2025-01-15'
      expected_delivery_date: '2025-02-01'
      po_status: ' Open '
      currency_code: USD
      total_amount_usd: 1500.0
      created_at: '2025-01-15'
      updated_at: '2025-01-20'
    - purchase_order_id: 101
      po_number: PO-00000101
      supplier_id: 2
      plant_id: 1
      buyer_employee_id: 2
      order_date: '2025-02-01'
      expected_delivery_date: '2025-02-15'
      po_status: CLOSED
      currency_code: USD
      total_amount_usd: 3200.5
      created_at: '2025-02-01'
      updated_at: '2025-02-10'
    - purchase_order_id: 102
      po_number: PO-00000102
      supplier_id: 3
      plant_id: 2
      buyer_employee_id: 3
      order_date: '2025-03-01'
      expected_delivery_date: '2025-03-20'
      po_status: Partial
      currency_code: USD
      total_amount_usd: 875.25
      created_at: '2025-03-01'
      updated_at: '2025-03-05'
  expect:
    rows:
    - purchase_order_id: 100
      po_status: open
    - purchase_order_id: 101
      po_status: closed
    - purchase_order_id: 102
      po_status: partial
