# Staging layer models with deduplication, type casting, and data quality tests.
version: 2
models:
- name: stg_supplier
  description: Staged supplier master with deduplication, type casting, and audit
    columns.
  columns:
  - name: supplier_id
    description: Primary key for supplier.
    data_tests:
    - unique
    - not_null
- name: stg_material
  description: Staged material master with standardized units and cost fields.
  columns:
  - name: material_id
    description: Primary key for material.
    data_tests:
    - unique
    - not_null
- name: stg_plant
  description: Staged plant master with regional attributes.
  columns:
  - name: plant_id
    description: Primary key for plant.
    data_tests:
