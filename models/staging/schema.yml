    description: Primary key for warehouse.
    data_tests:
    - unique
    - not_null
  - name: plant_id
    description: Foreign key to stg_plant.plant_id.
    data_tests:
    - relationships:
        to: ref('stg_plant')
        field: plant_id
- name: stg_machine
  description: Staged machine master with capacity and commissioning dates.
  columns:
